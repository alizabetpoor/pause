name: PAUSE CI and production deployment

on:
  pull_request:
    branches: [deploy]
  push:
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: pause-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application and Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and smoke-test production image
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -Eeuo pipefail
          docker buildx build --load --platform linux/amd64 \
            --build-arg "SITE_URL=${SITE_URL:-}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag pause-web:ci .

          container_id="$(docker run --detach --publish 127.0.0.1:3131:3000 pause-web:ci)"
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3131/ >/dev/null; then
              echo "Production container responded successfully."
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_id"
          echo "Production container did not respond within 60 seconds." >&2
          exit 1

  publish:
    name: Build and publish immutable GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate deployment build settings
        id: image
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          IMAGE_PLATFORM: ${{ vars.IMAGE_PLATFORM }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${SITE_URL:-}" ]]; then
            echo "Set the GitHub Actions variable SITE_URL to the verified HTTPS production origin before deploying." >&2
            exit 1
          fi
          node -e 'const u = new URL(process.argv[1]); if (u.protocol !== "https:" || !u.hostname || ["localhost", "127.0.0.1", "::1"].includes(u.hostname)) process.exit(1)' "$SITE_URL" \
            || { echo "SITE_URL must be a valid HTTPS production origin." >&2; exit 1; }
          node -e 'const h = new URL(process.argv[1]).hostname.toLowerCase(); const p = h.split("."); const private172 = p[0] === "172" && Number(p[1]) >= 16 && Number(p[1]) <= 31; if (h.endsWith(".localhost") || h.endsWith(".local") || h.endsWith(".test") || h.startsWith("10.") || h.startsWith("192.168.") || private172) process.exit(1)' "$SITE_URL" || { echo "SITE_URL cannot use a local or private host." >&2; exit 1; }
          case "${IMAGE_PLATFORM:-}" in
            linux/amd64|linux/arm64) ;;
            *) echo "Set IMAGE_PLATFORM to linux/amd64 or linux/arm64 after checking the VPS architecture." >&2; exit 1 ;;
          esac

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push exact commit image
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          IMAGE_PLATFORM: ${{ vars.IMAGE_PLATFORM }}
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -Eeuo pipefail
          docker buildx build --push \
            --platform "$IMAGE_PLATFORM" \
            --build-arg "SITE_URL=$SITE_URL" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$TAG" \
            --cache-from type=gha,scope=pause-production \
            --cache-to type=gha,scope=pause-production,mode=max \
            .

          docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null
          echo "Published and verified $IMAGE:$TAG"

  deploy:
    name: Deploy verified image to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate SSH settings and install verified host key
        id: ssh
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
        run: |
          set -Eeuo pipefail
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "VPS_HOST is missing or invalid." >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || { echo "VPS_USER is missing or invalid." >&2; exit 1; }
          [[ "$VPS_APP_DIR" =~ ^/[A-Za-z0-9_./-]+$ && ! "$VPS_APP_DIR" =~ (^|/)\.\.(/|$) ]] || { echo "VPS_APP_DIR must be a safe absolute path without parent segments." >&2; exit 1; }
          [[ "$VPS_SSH_PRIVATE_KEY" == *"PRIVATE KEY-----"* ]] || { echo "VPS_SSH_PRIVATE_KEY is missing or malformed." >&2; exit 1; }
          [[ "$VPS_KNOWN_HOSTS" == *"ssh-"* ]] || { echo "VPS_KNOWN_HOSTS must contain a host key verified from the VPS console." >&2; exit 1; }
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && ((port > 0 && port <= 65535)) || { echo "VPS_PORT must be between 1 and 65535." >&2; exit 1; }

          ssh_dir="$RUNNER_TEMP/pause-deploy-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh-keygen -y -f "$ssh_dir/id_ed25519" >/dev/null

          echo "directory=$VPS_APP_DIR" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Check VPS prerequisites before transfer
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.ssh.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ steps.ssh.outputs.directory }}
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/pause-deploy-ssh"
          ssh_options=(-p "$VPS_PORT" -i "$ssh_dir/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          printf -v remote_command 'bash -s -- %q' "$VPS_APP_DIR"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          app_dir="$1"
          [[ -d "$app_dir" ]] || { echo "Deployment directory does not exist: $app_dir. Create it first." >&2; exit 1; }
          [[ -f "$app_dir/.env" ]] || { echo "Production .env is missing in $app_dir. Create it before deploying." >&2; exit 1; }
          command -v docker >/dev/null || { echo "Docker is unavailable to the SSH deployment user." >&2; exit 1; }
          docker compose version >/dev/null 2>&1 || { echo "Docker Compose v2 is required." >&2; exit 1; }
          REMOTE

      - name: Transfer only production Compose and deployment script
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.ssh.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ steps.ssh.outputs.directory }}
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/pause-deploy-ssh"
          ssh_options=(-P "$VPS_PORT" -i "$ssh_dir/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          scp "${ssh_options[@]}" compose.production.yaml deploy/deploy.sh "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Deploy exact published image and verify health
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ steps.ssh.outputs.port }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ steps.ssh.outputs.directory }}
          GHCR_IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/pause-deploy-ssh"
          ssh_options=(-p "$VPS_PORT" -i "$ssh_dir/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts")
          printf -v remote_command 'bash %q %q %q %q' "$VPS_APP_DIR/deploy.sh" "$VPS_APP_DIR" "$GHCR_IMAGE" "$IMAGE_TAG"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "$remote_command"
